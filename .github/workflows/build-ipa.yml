
name: Build SmartTube iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer

      - name: Set up project configuration
        env:
          FIREBASE_PLIST_BASE64: ${{ secrets.FIREBASE_PLIST_BASE64 }}
        run: |
          test -n "$FIREBASE_PLIST_BASE64" || {
            echo "Firebase configuration secret is missing"
            exit 1
          }

          mkdir -p SmartTubeApp/Config

          cat > SmartTubeApp/Config/Secrets.xcconfig <<'EOF'
          SMARTTUBE_TEAM_ID =
          SMARTTUBE_TV_TEAM_ID =
          EOF

          echo "$FIREBASE_PLIST_BASE64" | base64 --decode \
            > SmartTubeApp/SmartTubeApp/GoogleService-Info.plist

          mkdir -p "SmartTubeApp/Smart Tube"
          cp SmartTubeApp/SmartTubeApp/GoogleService-Info.plist \
            "SmartTubeApp/Smart Tube/GoogleService-Info.plist"

      - name: Show available schemes
        run: |
          xcodebuild -list \
            -workspace SmartTube.xcworkspace


      - name: Build unsigned iOS app
        shell: bash
        run: |
          set -o pipefail


xcodebuild \
  -workspace SmartTube.xcworkspace \
  -scheme SmartTube \
  -configuration Release \
  -sdk iphoneos \
  -destination 'generic/platform=iOS' \
  -derivedDataPath "$RUNNER_TEMP/SmartTubeBuild" \
  SWIFT_VERSION=5 \
  CODE_SIGNING_ALLOWED=NO \
  -jobs 2 \
  build > build.log 2>&1


          RESULT=$?

          echo "========== COMPILER ERRORS =========="
          grep -n -C 5 -E \
            'error:|fatal error:|failed|Error Domain=' \
            build.log | head -200 || true

          echo "========== LAST 100 LINES =========="
          tail -100 build.log

          exit "$RESULT"

      - name: Upload complete build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Complete-Build-Log
          path: build.log
          if-no-files-found: ignore


      - name: Display build errors
        if: failure()
        run: |
          echo "===== BUILD ERRORS ====="
          grep -n -E \
            'error:|fatal error:|BUILD FAILED|The following build commands failed' \
            build.log | tail -80 || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Build-Log
          path: build.log
          if-no-files-found: ignore

      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/SmartTubeBuild/Build/Products/Release-iphoneos" \
            -maxdepth 1 -name '*.app' -type d | head -n 1)

          test -n "$APP" || {
            echo "No .app bundle was produced"
            exit 1
          }

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry SmartTube.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SmartTube-Unsigned-IPA
          path: SmartTube.ipa
          retention-days: 7
